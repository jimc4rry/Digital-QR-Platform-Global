name: Database backup

on:
  schedule:
    - cron: "15 3 * * *"  # 03:15 UTC daily
  workflow_dispatch: {}   # allows a manual "Run workflow" from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 18 client (must match the server's major version)
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump and compress
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -o pipefail
          # ubuntu-latest ships its own (older) postgresql-client already, and
          # it wins on PATH over the v18 one just installed above - confirmed
          # by a real failure here (pg_dump 16.14 refusing to talk to an 18.4
          # server). Call the versioned binary explicitly instead of relying
          # on whatever "pg_dump" resolves to on PATH.
          PGDUMP=/usr/lib/postgresql/18/bin/pg_dump
          "$PGDUMP" --version
          FILE="backup-$(date +%Y-%m-%d).sql.gz"
          "$PGDUMP" "$BACKUP_DATABASE_URL" --no-owner --no-privileges --verbose | gzip > "$FILE"
          echo "Dump written: $FILE ($(du -h "$FILE" | cut -f1))"
          # A real dump of this app's schema is at minimum tens of KB - anything
          # near-empty means pg_dump silently produced nothing useful (e.g. wrong
          # connection string, or the pipe swallowing a failed pg_dump exit code).
          MIN_BYTES=5000
          ACTUAL_BYTES=$(stat -c%s "$FILE")
          if [ "$ACTUAL_BYTES" -lt "$MIN_BYTES" ]; then
            echo "::error::Backup file is only $ACTUAL_BYTES bytes (expected at least $MIN_BYTES) - pg_dump likely failed silently."
            exit 1
          fi

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.sql.gz
          retention-days: 30
